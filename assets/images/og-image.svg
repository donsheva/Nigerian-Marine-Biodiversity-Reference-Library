<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle wave decoration -->
  <path d="M0 420 Q150 380 300 420 Q450 460 600 420 Q750 380 900 420 Q1050 460 1200 420 L1200 630 L0 630 Z" fill="url(#wave)"/>
  <path d="M0 480 Q200 450 400 480 Q600 510 800 480 Q1000 450 1200 480 L1200 630 L0 630 Z" fill="#2563eb" fill-opacity="0.06"/>

  <!-- DNA double-helix motif (right side decoration) -->
  <g opacity="0.13" transform="translate(1000, 80)">
    <!-- Left strand -->
    <path d="M20 0 Q60 40 20 80 Q-20 120 20 160 Q60 200 20 240 Q-20 280 20 320 Q60 360 20 400" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right strand -->
    <path d="M100 0 Q60 40 100 80 Q140 120 100 160 Q60 200 100 240 Q140 280 100 320 Q60 360 100 400" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Rungs -->
    <line x1="20" y1="40" x2="100" y2="40" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="80" x2="100" y2="80" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="120" x2="100" y2="120" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="160" x2="100" y2="160" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="200" x2="100" y2="200" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="240" x2="100" y2="240" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="280" x2="100" y2="280" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="320" x2="100" y2="320" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="360" x2="100" y2="360" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="190" width="5" height="68" rx="3" fill="url(#accent)"/>

  <!-- Main title -->
  <text x="104" y="228" font-family="'Sora', 'DM Sans', system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Nigerian Marine Biodiversity</text>
  <text x="104" y="278" font-family="'Sora', 'DM Sans', system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Reference Library</text>

  <!-- Subtitle -->
  <text x="104" y="330" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#93c5fd" letter-spacing="0.2">DNA barcode coverage of 107 West African marine taxa</text>

  <!-- Divider line -->
  <rect x="80" y="365" width="560" height="1.5" rx="1" fill="#2563eb" fill-opacity="0.4"/>

  <!-- Stats row -->
  <g font-family="'DM Mono', 'DM Sans', monospace, sans-serif">
    <!-- Stat 1 -->
    <text x="104" y="408" font-size="32" font-weight="700" fill="#ffffff">107</text>
    <text x="104" y="432" font-size="14" font-weight="400" fill="#64a3d4">Taxa catalogued</text>

    <!-- Divider -->
    <rect x="225" y="388" width="1" height="50" fill="#2563eb" fill-opacity="0.35"/>

    <!-- Stat 2 -->
    <text x="248" y="408" font-size="32" font-weight="700" fill="#ffffff">5</text>
    <text x="248" y="432" font-size="14" font-weight="400" fill="#64a3d4">DNA markers tracked</text>

    <!-- Divider -->
    <rect x="380" y="388" width="1" height="50" fill="#2563eb" fill-opacity="0.35"/>

    <!-- Stat 3 -->
    <text x="402" y="408" font-size="32" font-weight="700" fill="#ffffff">v21</text>
    <text x="402" y="432" font-size="14" font-weight="400" fill="#64a3d4">Current release</text>
  </g>

  <!-- Badge pills -->
  <rect x="104" y="468" width="90" height="28" rx="14" fill="#2563eb" fill-opacity="0.22"/>
  <text x="149" y="487" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">COI</text>

  <rect x="204" y="468" width="90" height="28" rx="14" fill="#2563eb" fill-opacity="0.22"/>
  <text x="249" y="487" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">12S</text>

  <rect x="304" y="468" width="90" height="28" rx="14" fill="#2563eb" fill-opacity="0.22"/>
  <text x="349" y="487" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">18S</text>

  <rect x="404" y="468" width="90" height="28" rx="14" fill="#2563eb" fill-opacity="0.22"/>
  <text x="449" y="487" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">28S</text>

  <rect x="504" y="468" width="90" height="28" rx="14" fill="#2563eb" fill-opacity="0.22"/>
  <text x="549" y="487" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">rbcL</text>

  <!-- Domain footer -->
  <text x="104" y="580" font-family="'DM Mono', monospace, sans-serif" font-size="18" font-weight="500" fill="#3b82f6" letter-spacing="0.5">envirobiotics.org</text>

  <!-- Envirobiotics wordmark (top-left) -->
  <text x="80" y="110" font-family="'Sora', 'DM Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#3b82f6" letter-spacing="1.5" text-transform="uppercase">ENVIROBIOTICS.ORG</text>
  <text x="80" y="132" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#475e82">Open reference data for Nigerian marine biodiversity</text>
</svg>
